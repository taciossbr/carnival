<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta

        content="width=device-width, initial-scale=1.0"

    <title>📅 CALENDÁRIO ANUAL</title>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.29.0/full/pyodide.js"></script>


    <style>

        /* =========================================================
           BASE
           ========================================================= */

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 20px;

            font:
                16px
                "Helvetica Neue",
                Arial,
                Helvetica,
                sans-serif;

            background: #f2f2f2;

            color: #000;

        }


        /* =========================================================
           CONFIGURAÇÃO
           ========================================================= */

        .config {

            width: 100%;

            max-width: 500px;

            margin: 0 auto;

            background: #fff;

            border: 3px solid #000;

            padding: 20px;

        }


        .config h1 {

            margin: 0 0 20px 0;

            font-size: 24px;

            text-align: center;

            border-bottom: 4px solid #000;

            padding-bottom: 10px;

        }


        .campo {

            margin-bottom: 18px;

        }


        .campo label {

            display: block;

            font-weight: bold;

            margin-bottom: 6px;

        }


        .campo input {

            width: 100%;

            padding: 10px;

            border: 2px solid #000;

            background: #fff;

            color: #000;

        }


        #gerar:hover {

        #gerar:disabled {

        /* =========================================================

           ========================================================= */

            font-family: monospace;

        }

           RESULTADO
           ========================================================= */

        }


        /* =========================================================
           CALENDÁRIO ANUAL

           IMPORTANTE:
           Não existem bordas nos dias.
           ========================================================= */

        .calendar-year {

            max-width: 210mm;

            margin: 0 auto;

            background: #fff;

            color: #000;

            display: flex;

           GRADE DOS MESES
           ========================================================= */

        .months {

            display: grid;

            grid-template-columns:

                1fr
                1fr;

            gap: 6mm;

            margin: 6mm;

        }

           TÍTULO DO MÊS

           CABEÇALHO DOS DIAS

        th {

           NÚMERO DO DIA

           FERIADOS

        }

        }


        .minas {

        }

        }

        }

           FOLGA
           ========================================================= */

        .folga {

            background-color: rgb(255, 255, 155);

        }


        /* =========================================================
           NOTAS DE FERIADO
           ========================================================= */

        .notas-feriado {

            flex-direction: column;

            font-size: 8pt;

            align-items: end;

            text-align: end;

        }


        .holiday-note {

            white-space: nowrap;

        }


        /* =========================================================
           EMOJIS
           
           O Firefox pode calcular a caixa vertical de emojis
           coloridos de maneira diferente do Chrome.

           Por isso o emoji fica isolado em seu próprio span,
           com tamanho e line-height controlados.
           ========================================================= */

        .emoji {

            display: inline-block;

            font-family:
                "Apple Color Emoji",
                "Segoe UI Emoji",

        div.notas-lua {

        /* =========================================================

        /* =========================================================
           IMPRESSÃO

        @page {

            }

                width: 210mm;

                    1fr

            /* =====================================================

                height: 1em;

    </style>

</head>


<body>


    <!-- =========================================================
         CONFIGURAÇÃO
         ========================================================= -->

    <section class="config">

        <h1>
            📅 CALENDÁRIO ANUAL
        </h1>


        <div class="campo">

            <label for="ano">
                Ano
            </label>

            <input
                type="number"
                id="ano"
                min="1900"
                max="2100"
            >

        </div>


        <div class="campo">

            <label for="folgaSeed">
                Data inicial das folgas
            </label>

            <input
                type="date"
                id="folgaSeed"
            >

            <div class="campo-info">
                A partir desta data, uma folga ocorre a cada 6 dias.
            </div>

        </div>


        <button id="gerar">
            GERAR CALENDÁRIO
        </button>


        <div id="status"></div>

    </section>


    <!-- =========================================================
         ERRO
         ========================================================= -->

    <div id="erro"></div>


    <!-- =========================================================
         RESULTADO
         ========================================================= -->

    <div id="resultado"></div>


    <script>

        // =========================================================
        // ELEMENTOS
        // =========================================================

        const botao =
            document.getElementById("gerar");


        const status =
            document.getElementById("status");


        const erro =
            document.getElementById("erro");


        const resultado =
            document.getElementById("resultado");


        const config =
            document.querySelector(".config");


        // =========================================================
        // ANO PADRÃO
        // =========================================================

        const anoAtual =
            new Date().getFullYear();


        document.getElementById("ano").value =
            anoAtual;


        // =========================================================
        // FOLGA SEED PADRÃO
        //
        // Mantém o comportamento original:
        // 05/01 do ano selecionado.
        // =========================================================

        document.getElementById("folgaSeed").value =
            `${anoAtual}-01-05`;


        // =========================================================
        // SE O ANO FOR ALTERADO,
        // ATUALIZA AUTOMATICAMENTE O SEED
        // SOMENTE SE O USUÁRIO AINDA ESTIVER USANDO
        // O SEED PADRÃO.
        // =========================================================

        const anoInput =
            document.getElementById("ano");


        const folgaSeedInput =
            document.getElementById("folgaSeed");


        let seedFoiAlteradoManualmente =
            false;


        folgaSeedInput.addEventListener(
            "change",
            () => {

                seedFoiAlteradoManualmente =
                    true;

            }
        );


        anoInput.addEventListener(
            "change",
            () => {

                if (
                    !seedFoiAlteradoManualmente
                ) {

                    const ano =
                        Number(
                            anoInput.value
                        );


                    if (
                        Number.isInteger(ano)
                    ) {

                        folgaSeedInput.value =
                            `${ano}-01-05`;

                    }

                }

            }
        );


        // =========================================================
        // BOTÃO
        // =========================================================

        botao.addEventListener(
            "click",
            gerar
        );


        // =========================================================
        // GERAR
        // =========================================================

        async function gerar() {

            erro.style.display = "none";

            erro.textContent = "";

            resultado.innerHTML = "";

            botao.disabled = true;


            try {

                // =================================================
                // PARÂMETROS
                // =================================================

                const ano =
                    Number(
                        anoInput.value
                    );


                const folgaSeed =
                    folgaSeedInput.value;


                // =================================================
                // VALIDAR ANO
                // =================================================

                if (
                    !Number.isInteger(ano) ||
                    ano < 1900 ||
                    ano > 2100
                ) {

                    throw new Error(
                        "Informe um ano entre 1900 e 2100."
                    );

                }


                // =================================================
                // VALIDAR FOLGA SEED
                // =================================================

                if (!folgaSeed) {

                    throw new Error(
                        "Informe a data inicial das folgas."
                    );

                }


                // =================================================
                // PYODIDE
                // =================================================

                status.textContent =
                    "🐍 Carregando Pyodide...";


                const pyodide =
                    await loadPyodide();


                // =================================================
                // MICROPIP
                // =================================================

                status.textContent =
                    "📦 Carregando micropip...";


                await pyodide.loadPackage(
                    "micropip"
                );


                const micropip =
                    pyodide.pyimport(
                        "micropip"
                    );


                // =================================================
                // HOLIDAYS
                // =================================================

                status.textContent =
                    "📦 Instalando holidays...";


                await micropip.install(
                    "holidays"
                );


                // =================================================
                // PASSAR PARÂMETROS
                // =================================================

                pyodide.globals.set(
                    "ANO",
                    ano
                );


                pyodide.globals.set(
                    "FOLGA_SEED_STR",
                    folgaSeed
                );


                // =================================================
                // PYTHON
                // =================================================

                status.textContent =
                    "⚙️ Gerando calendário...\n" +
                    "📅 Calculando feriados, folgas e fases da lua...";


                const python = `

from calendar import LocaleTextCalendar, SUNDAY
from datetime import date, timedelta
import holidays


# =============================================================
# CONFIGURAÇÃO
# =============================================================

YEAR = ANO


FOLGA_SEED = date.fromisoformat(
    FOLGA_SEED_STR
)


# =============================================================
# CALENDÁRIO
# =============================================================

cal = LocaleTextCalendar(
    firstweekday=SUNDAY
)


# =============================================================
# NOMES DOS MESES
# =============================================================

MONTH_LABELS = {

    1: "janeiro",
    2: "fevereiro",
    3: "março",
    4: "abril",
    5: "maio",
    6: "junho",
    7: "julho",
    8: "agosto",
    9: "setembro",
    10: "outubro",
    11: "novembro",
    12: "dezembro",

}


# =============================================================
# DIAS DA SEMANA
# =============================================================

WEEKDAY_LABEL = [

    "domingo",
    "segunda",
    "terça",
    "quarta",
    "quinta",
    "sexta",
    "sábado",

]


WEEKDAY_CLASS = [

    "domingo",
    "segunda",
    "terca",
    "quarta",
    "quinta",
    "sexta",
    "sabado",

]


# =============================================================
# FOLGAS
#
# A partir do FOLGA_SEED:
#
#     seed
#     seed + 6
#     seed + 12
#     seed + 18
#     ...
#
# Somente datas pertencentes ao ano selecionado são incluídas.
# =============================================================

def get_folgas():

    folgas = set()


    inicio_ano = date(
        YEAR,
        1,
        1
    )


    fim_ano = date(
        YEAR,
        12,
        31
    )


    atual = FOLGA_SEED


    # ---------------------------------------------------------
    # Se o seed estiver antes do ano selecionado,
    # pula diretamente para a primeira ocorrência possível
    # dentro do ano.
    # ---------------------------------------------------------

    if atual < inicio_ano:

        diferenca = (
            inicio_ano - atual
        ).days


        saltos = (
            diferenca + 5
        ) // 6


        atual += timedelta(
            days=saltos * 6
        )


    # ---------------------------------------------------------
    # Se o seed estiver depois do fim do ano,
    # não há folgas neste ano.
    # ---------------------------------------------------------

    if atual > fim_ano:

        return folgas


    # ---------------------------------------------------------
    # GERAÇÃO
    # ---------------------------------------------------------

    while atual <= fim_ano:

        folgas.add(
            atual
        )

        atual += timedelta(
            days=6
        )


    return folgas


# =============================================================
# EMOJIS DOS FERIADOS
# =============================================================

EMOJIS_FERIADOS = {

    "Confraternização Universal":
        "🎆",

    "Carnaval":
        "🎭",

    "Quarta-feira de Cinzas":
        "🩶",

    "Sexta-feira Santa":
        "✝️",

    "Paixão de Cristo":
        "✝️",

    "Tiradentes":
        "🚩",

    "Dia do Trabalhador":
        "🛠️",

    "Corpus Christi":
        "🙏",

    "Independência do Brasil":
        "🇧🇷",

    "Revolução Constitucionalista":
        "⚔️",

    "Dia do Gaúcho":
        "🧉",

    "São Domingos":
        "⛪",

    "Nossa Senhora da Abadia":
        "🙏",

    "Nossa Senhora Aparecida":
        "⛪",

    "Finados":
        "🕯️",

    "Proclamação da República":
        "🏛️",

    "Dia Nacional de Zumbi e da Consciência Negra":
        "✊",

    "Aniversário de Araxá":
        "🎉",

    "Véspera de Natal":
        "🎁",

    "Natal":
        "🎄",

    "Véspera de Ano-Novo":
        "🥂",

    "Ano Novo":
        "🎆",

}


# =============================================================
# EMOJI HTML
#
# O emoji é isolado para que o Firefox não deixe seu glyph
# controlar a altura da linha.
# =============================================================

def emoji_html(
    emoji
):

    if not emoji:

        return ""


    return (
        '<span class="emoji">'
        f'{emoji}'
        '</span>'
    )


# =============================================================
# FERIADOS
# =============================================================

def get_feriados():

    nacional = holidays.country_holidays(
        "BR",
        years=YEAR,
        language="pt_BR"
    )


    sp = holidays.country_holidays(
        "BR",
        subdiv="SP",
        years=YEAR,
        language="pt_BR"
    )


    mg = holidays.country_holidays(
        "BR",
        subdiv="MG",
        years=YEAR,
        language="pt_BR"
    )


    rs = holidays.country_holidays(
        "BR",
        subdiv="RS",
        years=YEAR,
        language="pt_BR"
    )


    opcionais = {

        **holidays.country_holidays(
            "BR",
            years=YEAR,
            categories="optional",
            language="pt_BR"
        ),

        date(
            YEAR,
            2,
            18
        ):
            "Quarta-feira de Cinzas<br/>(facultativo até as 14h)",

    }


    araxa = {

        **{

            hdate: hname

            for hdate, hname
            in opcionais.items()

            if hname in [
                "Carnaval",
                "Corpus Christi"
            ]

        },


        date(
            YEAR,
            8,
            8
        ):
            "São Domingos",


        date(
            YEAR,
            8,
            15
        ):
            "Nossa Senhora da Abadia",


        date(
            YEAR,
            12,
            19
        ):
            "Aniversário de Araxá",

    }


    feriados = {

        **{
            hdate: [
                hname,
                "opcional"
            ]

            for hdate, hname
            in opcionais.items()
        },


        **{
            hdate: [
                hname,
                "araxa"
            ]

            for hdate, hname
            in araxa.items()
        },


        **{
            hdate: [
                hname,
                "sul"
            ]

            for hdate, hname
            in rs.items()
        },


        **{
            hdate: [
                hname,
                "minas"
            ]

            for hdate, hname
            in mg.items()
        },


        **{
            hdate: [
                hname,
                "sao-paulo"
            ]

            for hdate, hname
            in sp.items()
        },


        **{
            hdate: [
                hname,
                "nacional"
            ]

            for hdate, hname
            in nacional.items()
        },

    }


    return feriados


# =============================================================
# FASE DA LUA
# =============================================================

def fase_da_lua(
    d: date
):

    lua_nova_ref = date(
        2000,
        1,
        6
    )


    ciclo = 29.53058867


    dias = (
        d - lua_nova_ref
    ).days


    idade = dias % ciclo


    if idade < 7.38265:

        return "Lua Nova 🌑"


    elif idade < 14.76529:

        return "Crescente 🌓"


    elif idade < 22.14794:

        return "Lua Cheia 🌕"


    else:

        return "Minguante 🌗"


# =============================================================
# DETECTAR MUDANÇAS DE FASE
# =============================================================

def get_fases_lua():

    inicio = date(
        YEAR,
        1,
        1
    )


    fim = date(
        YEAR,
        12,
        31
    )


    resultado = {}


    atual = inicio


    fase_anterior = fase_da_lua(
        atual
    )


    atual += timedelta(
        days=1
    )


    while atual <= fim:

        fase_atual = fase_da_lua(
            atual
        )


        if fase_atual != fase_anterior:

            resultado[
                atual
            ] = fase_atual


            fase_anterior = fase_atual


        atual += timedelta(
            days=1
        )


    return resultado


# =============================================================
# DADOS
# =============================================================

FERIADOS = get_feriados()

FOLGAS = get_folgas()

FASES_LUA = get_fases_lua()


# =============================================================
# GERAR UM MÊS
# =============================================================

def gerar_mes(
    month
):

    html = f"""
    <table
        border="0"
        cellpadding="0"
        cellspacing="0"
        class="month"
    >

        <tr>

            <th
                colspan="7"
                class="month-title"
            >
                {MONTH_LABELS[month].capitalize()}
            </th>

        </tr>

        <tr>
    """


    # ---------------------------------------------------------
    # CABEÇALHO
    # ---------------------------------------------------------

    for label, css_class in zip(
        WEEKDAY_LABEL,
        WEEKDAY_CLASS
    ):

        html += (
            f'<th class="{css_class}">'
            f'{label[:3]}'
            f'</th>'
        )


    html += "</tr>"


    # ---------------------------------------------------------
    # DIAS
    # ---------------------------------------------------------

    month_holidays = []

    lua_month = []


    for week in cal.monthdays2calendar(
        YEAR,
        month
    ):

        html += "<tr>"


        for day, weekday in week:

            css_class = WEEKDAY_CLASS[
                weekday
            ]


            # -------------------------------------------------
            # DIA FORA DO MÊS
            # -------------------------------------------------

            if day == 0:

                html += (
                    '<td class="noday">'
                    '&nbsp;'
                    '</td>'
                )

                continue


            current_date = date(
                YEAR,
                month,
                day
            )


            classes = [
                css_class,
                "day"
            ]


            # -------------------------------------------------
            # FERIADO
            # -------------------------------------------------

            holiday = FERIADOS.get(
                current_date
            )


            if holiday:

                nome, categoria = holiday


                classes.append(
                    "feriado"
                )


                classes.append(
                    categoria
                )


                month_holidays.append(
                    (
                        day,
                        nome,
                        categoria
                    )
                )


            # -------------------------------------------------
            # FOLGA
            # -------------------------------------------------

            if current_date in FOLGAS:

                classes.append(
                    "folga"
                )


            # -------------------------------------------------
            # LUA
            # -------------------------------------------------

            fase = FASES_LUA.get(
                current_date
            )


            if fase:

                lua_month.append(
                    (
                        day,
                        fase
                    )
                )


            # -------------------------------------------------
            # DIA
            # -------------------------------------------------

            html += (

                f'<td class="{" ".join(classes)}">'

                f'<span class="day-number">'
                f'{day}'
                f'</span>'

                '</td>'

            )


        html += "</tr>"


    # =========================================================
    # NOTAS DE FERIADOS
    # =========================================================
